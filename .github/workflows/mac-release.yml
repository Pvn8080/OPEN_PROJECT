name: Build downloadable Mac apps

on:
  workflow_dispatch:
  push:
    branches: [codex/mac-release]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-latest
          - architecture: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:desktop
      - name: Package and ad-hoc sign on macOS
        run: npm run package:mac:${{ matrix.architecture }}
      - name: Launch packaged app and verify local editing
        run: npm run smoke:mac -- ${{ matrix.architecture }}
      - name: Validate bundle and make download
        env:
          BUILD_ARCH: ${{ matrix.architecture }}
        run: |
          APP="mac-release/Open Project-darwin-${BUILD_ARCH}/Open Project.app"
          if ! codesign --verify --deep --strict --verbose=2 "$APP" 2> signature-check.txt; then
            while IFS= read -r line; do echo "::error::$line"; done < signature-check.txt
            exit 1
          fi
          file "$APP/Contents/MacOS/Open Project"
          mkdir -p downloads
          ditto -c -k --sequesterRsrc --keepParent "$APP" "downloads/Open-Project-Mac-${BUILD_ARCH}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.architecture }}
          path: downloads/*.zip
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-*
          merge-multiple: true
          path: downloads
      - name: Publish downloadable development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mac-preview-${GITHUB_RUN_NUMBER}" downloads/*.zip \
            --target "$GITHUB_SHA" \
            --title "Open Project Mac development build ${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --notes-file desktop/RELEASE-NOTES.md
