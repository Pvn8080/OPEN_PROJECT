name: Publish browser planner

on:
  workflow_dispatch:
  push:
    branches: [codex/web-preview]

permissions:
  contents: read

concurrency:
  group: browser-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:portable
      - run: npx playwright install --with-deps chromium
      - name: Test the exact hosted browser artifact
        run: npx tsx scripts/smoke-web.ts
      - name: Prepare website
        run: |
          mkdir -p web-preview
          cp portable/Open-Project.html web-preview/index.html
          touch web-preview/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
